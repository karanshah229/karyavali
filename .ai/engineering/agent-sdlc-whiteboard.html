<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent SDLC Whiteboard</title>
  <style>
    :root{font:14px/1.35 system-ui,sans-serif;color:#e8edf5;background:#161b22}*{box-sizing:border-box}body{margin:0;overflow:hidden}header{height:58px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid #303946;background:#20262f}h1{margin:0 10px 0 0;font-size:16px;white-space:nowrap}.spacer{flex:1}button,label.file{border:1px solid #526071;border-radius:6px;background:#2a3441;color:#edf3fb;padding:7px 10px;font:inherit;cursor:pointer}button:hover,label.file:hover,button.active{background:#356dad;border-color:#5e9ee8}label.file input{display:none}#shell{height:calc(100vh - 58px);display:grid;grid-template-columns:1fr 260px}#viewport{position:relative;overflow:hidden;background-color:#111720;background-image:radial-gradient(#3a4656 1px,transparent 1px);background-size:20px 20px}#board{position:absolute;inset:0;width:3400px;height:760px;transform-origin:0 0}#edges{position:absolute;inset:0;width:3400px;height:760px;overflow:visible;pointer-events:none}#edges path{fill:none;stroke:#96a6ba;stroke-width:2;marker-end:url(#arrow);pointer-events:stroke;cursor:pointer}#edges path.selected{stroke:#65b4ff;stroke-width:3}.node{position:absolute;width:176px;min-height:74px;padding:11px 12px;border:2px solid #5c81aa;border-radius:9px;background:#dcecff;color:#10243c;box-shadow:0 5px 14px #0006;cursor:grab;user-select:none}.node:active{cursor:grabbing}.node.note{background:#fff2c7;border-style:dashed;border-color:#c49332;color:#49350d}.node.memory{background:#dff7e7;border-color:#39865a;color:#123d24}.node.decision{background:#f2e2ff;border-color:#9254b7;color:#451361}.node.selected{outline:3px solid #64b5ff;outline-offset:3px}.node.connect-source{outline-color:#ff9f43}.kind{display:block;margin-bottom:4px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;opacity:.62}.title{font-weight:650;white-space:pre-wrap}.note-text{margin-top:6px;font-size:12px;white-space:pre-wrap;opacity:.86}aside{padding:16px;border-left:1px solid #303946;background:#20262f;overflow:auto}aside h2{margin:0 0 12px;font-size:15px}.empty,.help{color:#a9b5c3}.field{display:grid;gap:5px;margin:12px 0;color:#bdc8d5;font-size:12px}input,textarea,select{width:100%;border:1px solid #536173;border-radius:5px;background:#161c25;color:#eff4fa;padding:8px;font:inherit}textarea{min-height:96px;resize:vertical}.danger{color:#ffd7d7;background:#622f35;border-color:#a1555e}@media(max-width:850px){#shell{grid-template-columns:1fr}aside{display:none}.hide-small{display:none}}
    #viewport.space-held{cursor:grab}#viewport.panning{cursor:grabbing}
  </style>
</head>
<body>
  <header><h1>Agent SDLC whiteboard</h1><button id="add-stage">+ Stage</button><button id="add-note">+ Note</button><button id="connect">Connect</button><button id="undo" title="Undo (Ctrl/⌘ Z)">Undo</button><button id="redo" title="Redo (Ctrl/⌘ Shift Z)">Redo</button><button id="zoom-out" class="hide-small">−</button><button id="zoom-in" class="hide-small">+</button><button id="fit" class="hide-small">Fit</button><span class="spacer"></span><button id="export">Export</button><label class="file">Import<input id="import" type="file" accept="application/json"></label><button id="reset">Reset</button></header>
  <main id="shell"><section id="viewport" aria-label="Editable SDLC lifecycle diagram"><div id="board"><svg id="edges"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#96a6ba"/></marker></defs></svg><div id="nodes"></div></div></section><aside id="inspector"><h2>Inspector</h2><p class="empty">Select a stage, note, or arrow to edit it.</p></aside></main>
  <script>
    (()=>{
      const key='karyavali-agent-sdlc-board-v2', q=s=>document.querySelector(s), viewport=q('#viewport'), board=q('#board'), nodesEl=q('#nodes'), svg=q('#edges'), inspector=q('#inspector'); let selected=null,connecting=null,drag=null,pan=null,spaceHeld=false,scale=1,panX=0,panY=0;
      const raw=[['request','Change request',80,250,'stage'],['intake','Intake & classify',300,250,'stage'],['discovery','Discovery',520,250,'stage'],['brief','Brief & acceptance',740,250,'stage'],['design','Design',960,250,'stage'],['plan','Implementation plan',1180,250,'stage'],['execute','Specialist execution',1400,250,'stage'],['verify','Verification',1620,250,'stage'],['review','Independent review',1840,250,'stage'],['release','Release decision',2060,250,'decision'],['deploy','Deploy',2280,250,'stage'],['observe','Observe in production',2500,250,'stage'],['learn','Curate learning',2720,250,'decision'],['memory','Curated memory',520,60,'memory'],['skills','Skills',780,60,'memory'],['agents','Agent contracts',1080,60,'memory'],['validators','Validators',1620,60,'memory'],['evidence','Run evidence\nCommands, artifacts, gate results',1480,470,'note'],['insight','Memory candidate\nSource, scope, confidence',540,470,'note'],['production','Production evidence\nTelemetry, incidents, feedback',2500,470,'note']];
      const starter=()=>{const nodes=raw.map(([id,title,x,y,kind])=>({id,title,x,y,kind,notes:''}));const flow=['request','intake','discovery','brief','design','plan','execute','verify','review','release','deploy','observe','learn'];const edges=flow.slice(0,-1).map((from,i)=>({id:'e'+i,from,to:flow[i+1]}));edges.push(...[['memory','discovery'],['skills','execute'],['agents','plan'],['validators','verify'],['execute','evidence'],['discovery','insight'],['observe','production']].map(([from,to],i)=>({id:'x'+i,from,to})));return{nodes,edges}};
      let state=(()=>{try{return JSON.parse(localStorage.getItem(key))||starter()}catch{return starter()}})(),history=[JSON.stringify(state)],historyIndex=0;const save=()=>{const snapshot=JSON.stringify(state);localStorage.setItem(key,snapshot);if(history[historyIndex]!==snapshot){history=history.slice(0,historyIndex+1);history.push(snapshot);historyIndex++;}},restore=index=>{if(index<0||index>=history.length)return;historyIndex=index;state=JSON.parse(history[historyIndex]);localStorage.setItem(key,history[historyIndex]);selected=null;connecting=null;render();inspect()},byId=id=>state.nodes.find(n=>n.id===id),center=n=>({x:n.x+88,y:n.y+37});
      function render(){nodesEl.innerHTML='';svg.querySelectorAll('.edge').forEach(x=>x.remove());state.edges.forEach(e=>{const f=byId(e.from),t=byId(e.to);if(!f||!t)return;const a=center(f),b=center(t),mid=(a.x+b.x)/2,p=document.createElementNS('http://www.w3.org/2000/svg','path');p.classList.add('edge');if(selected?.type==='edge'&&selected.id===e.id)p.classList.add('selected');p.setAttribute('d',`M ${a.x} ${a.y} C ${mid} ${a.y}, ${mid} ${b.y}, ${b.x} ${b.y}`);p.onclick=ev=>{ev.stopPropagation();selected={type:'edge',id:e.id};connecting=null;render();inspect()};svg.append(p)});state.nodes.forEach(n=>{const e=document.createElement('article');e.className=`node ${n.kind}${selected?.type==='node'&&selected.id===n.id?' selected':''}${connecting===n.id?' connect-source':''}`;e.style.left=n.x+'px';e.style.top=n.y+'px';e.dataset.id=n.id;e.innerHTML=`<span class="kind">${n.kind}</span><div class="title"></div>${n.notes?'<div class="note-text"></div>':''}`;e.querySelector('.title').textContent=n.title;if(n.notes)e.querySelector('.note-text').textContent=n.notes;e.onpointerdown=startDrag;e.onclick=pick;nodesEl.append(e)});board.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;q('#undo').disabled=historyIndex===0;q('#redo').disabled=historyIndex===history.length-1}
      function pick(ev){ev.stopPropagation();const id=ev.currentTarget.dataset.id;if(drag?.moved)return;if(connecting){if(connecting!==id&&!state.edges.some(e=>e.from===connecting&&e.to===id))state.edges.push({id:crypto.randomUUID(),from:connecting,to:id});connecting=null;q('#connect').classList.remove('active');save();render();return}selected={type:'node',id};render();inspect()}
      function startPan(ev){pan={x:panX,y:panY,sx:ev.clientX,sy:ev.clientY};viewport.classList.add('panning');ev.preventDefault()}
      function startDrag(ev){if(ev.button!==0||connecting)return;if(spaceHeld){startPan(ev);return}const n=byId(ev.currentTarget.dataset.id);drag={n,x:n.x,y:n.y,sx:ev.clientX,sy:ev.clientY,moved:false}}
      board.addEventListener('pointerdown',ev=>{if(ev.button===0&&spaceHeld&&!ev.target.closest('.node'))startPan(ev)});addEventListener('pointermove',ev=>{if(pan){panX=pan.x+ev.clientX-pan.sx;panY=pan.y+ev.clientY-pan.sy;render();return}if(!drag)return;const dx=(ev.clientX-drag.sx)/scale,dy=(ev.clientY-drag.sy)/scale;drag.moved||=(Math.abs(dx)+Math.abs(dy)>2);drag.n.x=Math.max(0,drag.x+dx);drag.n.y=Math.max(0,drag.y+dy);render()});addEventListener('pointerup',()=>{if(pan){pan=null;viewport.classList.remove('panning');return}if(!drag)return;if(drag.moved){save();selected={type:'node',id:drag.n.id};inspect()}drag=null});addEventListener('keydown',ev=>{if(ev.code==='Space'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){spaceHeld=true;viewport.classList.add('space-held');ev.preventDefault()}});addEventListener('keyup',ev=>{if(ev.code==='Space'){spaceHeld=false;viewport.classList.remove('space-held')}});
      function inspect(){if(!selected){inspector.innerHTML='<h2>Inspector</h2><p class="empty">Select a stage, note, or arrow to edit it.</p>';return}if(selected.type==='edge'){inspector.innerHTML='<h2>Connection</h2><p class="help">A one-way dependency.</p><button id="delete" class="danger">Delete connection</button>';q('#delete').onclick=()=>{state.edges=state.edges.filter(e=>e.id!==selected.id);selected=null;save();render();inspect()};return}const n=byId(selected.id);inspector.innerHTML='<h2>Stage</h2><label class="field">Title<input id="title"></label><label class="field">Type<select id="kind"><option value="stage">Stage</option><option value="memory">Memory / capability</option><option value="decision">Decision / gate</option><option value="note">Note</option></select></label><label class="field">Notes<textarea id="notes" placeholder="Context, constraints, owner, or acceptance criteria"></textarea></label><p class="help">Drag to move. Select a source, then Connect, then select the target.</p><button id="delete" class="danger">Delete selected</button>';const title=q('#title'),kind=q('#kind'),notes=q('#notes');title.value=n.title;kind.value=n.kind;notes.value=n.notes;[title,kind,notes].forEach(x=>x.oninput=()=>{n.title=title.value;n.kind=kind.value;n.notes=notes.value;save();render()});q('#delete').onclick=()=>{state.nodes=state.nodes.filter(x=>x.id!==n.id);state.edges=state.edges.filter(e=>e.from!==n.id&&e.to!==n.id);selected=null;save();render();inspect()}}
      function add(kind){const n={id:crypto.randomUUID(),title:kind==='note'?'New note':'New stage',notes:'',kind,x:140+Math.random()*300,y:120+Math.random()*280};state.nodes.push(n);selected={type:'node',id:n.id};save();render();inspect()}
      q('#undo').onclick=()=>restore(historyIndex-1);q('#redo').onclick=()=>restore(historyIndex+1);addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='z'){ev.preventDefault();restore(historyIndex+(ev.shiftKey?1:-1))}else if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='y'){ev.preventDefault();restore(historyIndex+1)}});q('#add-stage').onclick=()=>add('stage');q('#add-note').onclick=()=>add('note');q('#connect').onclick=()=>{if(connecting){connecting=null;q('#connect').classList.remove('active');render();return}if(selected?.type!=='node'){alert('Select a source stage first.');return}connecting=selected.id;q('#connect').classList.add('active');render()};q('#reset').onclick=()=>{if(confirm('Reset the whiteboard?')){state=starter();selected=null;save();render();inspect()}};q('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=Object.assign(document.createElement('a'),{href:url,download:'agent-sdlc-whiteboard.json'});a.click();URL.revokeObjectURL(url)};q('#import').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.nodes)||!Array.isArray(d.edges))throw 0;state=d;selected=null;save();render();inspect()}catch{alert('Choose a board JSON exported by this whiteboard.')}};r.readAsText(f);e.target.value=''};viewport.onclick=()=>{if(!connecting){selected=null;render();inspect()}};viewport.addEventListener('wheel',event=>{event.preventDefault();const factor=event.deltaY<0?1.12:1/1.12;scale=Math.max(.35,Math.min(1.8,scale*factor));render()},{passive:false});q('#zoom-in').onclick=()=>{scale=Math.min(1.8,scale+.1);render()};q('#zoom-out').onclick=()=>{scale=Math.max(.35,scale-.1);render()};q('#fit').onclick=()=>{scale=Math.min(1,(viewport.clientWidth-20)/3400);render()};render();inspect();q('#fit').click()
    })()
  </script>
</body>
</html>
